<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Span and Div</title>
</head>
<body>
    <!-- GROUP TOGETHER HTML -->
    <!-- <span> inline container to group elements for Styling -->
    <!-- <div> block container to group elements for styling purpose-->
        <h1><span>This is a span title</span></h1>
        <h1>This is a div title </h1>
</body>
</html>
